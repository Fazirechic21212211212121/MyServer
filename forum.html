<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Форум PressLore</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#14532d);
    font-family:Segoe UI,sans-serif;
    color:white;
}

.card{
    width:600px;
    max-width:90%;
    text-align:center;
    background:rgba(15,23,42,.8);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:40px;
    box-shadow:0 0 40px rgba(34,197,94,.25);
}

.logo{
    font-size:70px;
}

h1{
    color:#22c55e;
    margin:10px 0;
}

p{
    color:#cbd5e1;
    font-size:18px;
}

.btn{
    display:inline-block;
    margin-top:25px;
    padding:14px 25px;
    background:#22c55e;
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-weight:bold;
    transition:.2s;
}

.btn:hover{
    transform:scale(1.05);
}
</style>

</head>
<body>

<div class="card">

    <div class="logo">💬</div>

    <h1>Форум PressLore</h1>

    <p>
        Форум находится в разработке.
        Скоро здесь появятся:
    </p>

    <p>
        📢 Новости сервера<br>
        📝 Жалобы и апелляции<br>
        💡 Предложения игроков<br>
        💬 Общение сообщества
    </p>

    <a href="/" class="btn">
        Вернуться на главную
    </a>

</div>

</body>
</html>
