<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Страница не найдена</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #2b1055, #090016);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow: hidden;
    }

    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 1px, transparent 1px);
      background-size: 80px 80px, 120px 120px;
      background-position: 0 0, 40px 60px;
      opacity: 0.25;
      animation: moveStars 25s linear infinite;
    }

    @keyframes moveStars {
      from { transform: translateY(0); }
      to { transform: translateY(120px); }
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 40px;
    }

    .error {
      font-size: 150px;
      font-weight: 900;
      letter-spacing: 10px;
      background: linear-gradient(90deg, #ff00cc, #00ffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { filter: drop-shadow(0 0 10px #ff00cc); }
      to { filter: drop-shadow(0 0 25px #00ffff); }
    }

    h1 {
      font-size: 34px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      color: #d6d6d6;
      margin-bottom: 35px;
    }

    a {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 40px;
      background: linear-gradient(90deg, #ff00cc, #3333ff);
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 0 20px rgba(255, 0, 204, 0.5);
    }

    a:hover {
      transform: scale(1.08);
      box-shadow: 0 0 35px rgba(0, 255, 255, 0.8);
    }

    .planet {
      position: absolute;
      width: 180px;
      height: 180px;
      background: linear-gradient(135deg, #ff8a00, #e52e71);
      border-radius: 50%;
      right: -50px;
      bottom: -50px;
      box-shadow: 0 0 80px rgba(229, 46, 113, 0.6);
    }

    .planet::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 35px;
      border: 4px solid rgba(255,255,255,0.5);
      border-radius: 50%;
      top: 70px;
      left: -40px;
      transform: rotate(-20deg);
    }

    @media (max-width: 600px) {
      .error {
        font-size: 95px;
      }

      h1 {
        font-size: 26px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <div class="container">
    <div class="error">404</div>
    <h1>Ой! Страница потерялась</h1>
    <p>Похоже, эта страница улетела в космос.</p>
    <a href="/">Вернуться на главную</a>
  </div>

  <div class="planet"></div>
</body>
</html>
