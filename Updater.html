<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Скачивание файла</title>
</head>
<body>

    <p>Скачивание файла начинается...</p>

    <a id="downloadLink"
       href="https://example.com/file.zip"
       download>
        Скачать вручную
    </a>

    <script>
        window.onload = function () {
            document.getElementById("downloadLink").click();
        };
    </script>

</body>
</html>
