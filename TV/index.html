<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PressLore TV</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .player {
            width: min(1200px, 95%);
            aspect-ratio: 16 / 9;
            margin: 30px auto;
            background: black;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <h1>PressLore TV</h1>

    <div class="player">
        <iframe
            src="https://tv.presslore.eu/embed/video"
            title="Прямой эфир PressLore TV"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
